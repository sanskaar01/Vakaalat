<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vakaalat (वकालत) — Interactive Pitch Deck & Speaker Notes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <style>
    :root {
      --bg: #050506;
      --win-bg: #101216;
      --win-border: #343538;
      --title-bg: linear-gradient(180deg, #343538 0%, #242528 50%, #18191b 100%);
      --text: #f3f5f9;
      --muted: #9ba3b4;
      --accent: #7fb2ff;
      --gold: #eab308;
      --green: #3b943e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', Tahoma, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-x: hidden;
    }

    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image: radial-gradient(#ffffff 1.5px, transparent 1.5px),
        radial-gradient(#93c5fd 1.5px, transparent 1.5px);
      background-size: 90px 90px, 140px 140px;
      background-position: 0 0, 40px 60px;
      opacity: 0.28;
    }

    .deck-wrapper {
      position: relative;
      z-index: 10;
      max-width: 1120px;
      width: 100%;
      margin: 28px auto;
      padding: 0 24px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .xp-win {
      background: var(--win-bg);
      border: 2px solid var(--win-border);
      border-radius: 8px 8px 4px 4px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.75);
      overflow: hidden;
    }

    .xp-bar {
      background: var(--title-bg);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #2a2b2f;
      font-size: 13px;
      font-weight: 700;
    }

    .ctrls span {
      display: inline-flex;
      width: 20px;
      height: 20px;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 3px;
      font-size: 11px;
      margin-left: 4px;
    }

    .ctrls .close {
      background: #c93b23;
    }

    .slide-body {
      padding: 44px 52px;
      min-height: 430px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--accent);
      margin-bottom: 12px;
      font-weight: 700;
    }

    h1 {
      font-size: 42px;
      font-weight: 800;
      line-height: 1.15;
      margin-bottom: 18px;
    }

    .subtitle {
      font-size: 18px;
      color: var(--muted);
      line-height: 1.6;
      max-width: 820px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-top: 24px;
    }

    .card {
      background: #090a0d;
      border: 1px solid #262932;
      border-radius: 6px;
      padding: 18px;
    }

    .card h3 {
      font-size: 15px;
      color: var(--gold);
      margin-bottom: 8px;
    }

    .card p {
      font-size: 13.5px;
      color: #d5dbe6;
      line-height: 1.55;
    }

    .speech-box {
      margin-top: 18px;
      background: #0b1320;
      border: 1px solid #2b4c7e;
      border-radius: 6px;
      padding: 18px 22px;
    }

    .speech-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: #93c5fd;
      margin-bottom: 6px;
      font-weight: 700;
    }

    .speech-text {
      font-size: 15px;
      line-height: 1.65;
      color: #eef4ff;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 16px;
      gap: 12px;
    }

    .btn {
      background: linear-gradient(180deg, #323642 0%, #1e2129 100%);
      color: #fff;
      border: 1px solid #4e5566;
      border-radius: 4px;
      padding: 9px 18px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn:hover {
      border-color: var(--gold);
    }

    .btn-green {
      background: linear-gradient(180deg, #5cb85c 0%, #2a782d 100%);
      border-color: #1e5e20;
    }
  </style>
</head>

<body>
  <div className="stars"></div>
  <div class="deck-wrapper">
    <div class="xp-win">
      <div class="xp-bar">
        <span id="win-title">Vakaalat_Pitch_Deck.exe — Slide 1 of 10</span>
        <div class="ctrls">
          <span>_</span><span>□</span><span class="close">×</span>
        </div>
      </div>
      <div class="slide-body" id="slide-content"></div>
    </div>

    <div class="speech-box" id="speech-container">
      <div class="speech-label">🎙️ Your Nonchalant Founder Speech (Speak This Naturally):</div>
      <div class="speech-text" id="speech-content"></div>
    </div>

    <div class="toolbar">
      <div>
        <button class="btn" onclick="prevSlide()">← Previous Slide</button>
        <button class="btn btn-green" onclick="nextSlide()">Next Slide →</button>
      </div>
      <div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #9ba3b4">
        Use Left/Right Arrow Keys • <button class="btn" onclick="toggleSpeech()">Toggle Speech Notes</button>
      </div>
    </div>
  </div>

  <script>
    const slides = [
      {
        eyebrow: 'SLIDE 01 • THE BACKROOM COURT',
        title: 'वकालत | VAKAALAT — You Are Seen. You Are Heard.',
        subtitle: '“If it sticks with you when you are alone, you might as well share it here.” — A First-Aid Legal Engine & Anonymous Court of People for India.',
        cards: [
          { title: 'Start With the Pain', body: 'Built for the quiet moment after someone wrongs you and the world tells you to "stop overreacting and move on."' },
          { title: 'Zero Exposure', body: 'Nothing on Vakaalat happens without your consent. Your identity stays off the record.' },
          { title: 'Kanpur → Pan-India', body: 'Launching with Kanpur advocates and citizens, architected for every Indian city.' }
        ],
        speech: '“Hey everyone. So—this is Vakaalat. Before I get into the tech or the legal side, think about a very specific feeling: when something genuinely unfair happens to you—a landlord eats your deposit, a teacher hits a student, or you get scammed—and everyone around you says, ‘Bhai chhodo na, move on, stop overreacting.’ So you sit with it alone at night doubting yourself. We built Vakaalat for that exact moment. If it still bothers you when you’re alone, it belongs here.”'
      },
      {
        eyebrow: 'SLIDE 02 • THE REAL BARRIER',
        title: 'Why 95% of Everyday Wrongs Go Unchallenged',
        subtitle: 'Citizens don’t stay silent because they don’t care—they stay silent because the legal system feels alien, expensive, and exposed.',
        cards: [
          { title: '1. Legal Blindness', body: '“I don’t even know which Dhara or Act was broken—or if I’m just overthinking.”' },
          { title: '2. Chamber Intimidation', body: 'Walking into a physical court or hiring a lawyer feels too dramatic for everyday grievances.' },
          { title: '3. Fear of Exposure', body: 'Nobody wants their real name, family, school, or money losses exposed in public.' }
        ],
        speech: '“Look at why ordinary people in India don’t seek legal help. First, nobody teaches us the actual Dhaarein—you don’t know if what happened is a criminal offense under BNS or just bad luck. Second, hunting for a lawyer in Civil Lines feels huge and intimidating. And third—people are terrified of exposure. Nobody wants their real name or how much money they lost floating around in public.”'
      },
      {
        eyebrow: 'SLIDE 03 • POSITIONING',
        title: 'What Vakaalat Is (And What It Refuses To Be)',
        subtitle: 'We didn’t build another yellow-pages lawyer directory or a robotic textbook chatbot.',
        cards: [
          { title: 'NOT a Lawyer Directory', body: 'Advocates cannot buy ads or show off flashy paid portfolios here.' },
          { title: 'Live First-Aid Legal Engine', body: 'Instant constitutional & BNS computation on your raw story in English or Hinglish.' },
          { title: 'The Court of People', body: 'Reddit meets Twitter for anonymous help-seekers and verified advocates.' }
        ],
        speech: '“So let’s be clear about what we built. We did not build another directory where lawyers buy ads. Vakaalat is two things working together: One—an instant First-Aid Legal Engine that tells you where you stand the second you type or speak your story. And two—The Court of People. Think of it like Reddit and Twitter had a baby, built specifically for people who’ve been wronged and advocates who actually want to help.”'
      },
      {
        eyebrow: 'SLIDE 04 • CORE ENGINE',
        title: 'The 4-Pillar Live Gemini Legal Engine',
        subtitle: 'Every story is examined live with care, dignity, and statutory precision—never pre-generated scripts.',
        cards: [
          { title: '1. What the Laws Say', body: 'Exact count of violated Dhaarein (BNS, JJ Act, IT Act, Constitution) tied to your story.' },
          { title: '2. What That Wrongdoer Deserves', body: 'Statutory jail time, fines, victim compensation & disciplinary remedies.' },
          { title: '3. Seriousness Meter (/10)', body: 'Honest check on when an issue is beyond first-aid and needs a local lawyer.' },
          { title: '4. What You Can Do Now', body: 'Official Govt Portals (with hover "i" steps) + YouTube Knowledge Trailers.' }
        ],
        speech: '“Here’s what happens when you type or speak your story into our desk. Our backend runs your exact story through four pillars live on Gemini: Pillar 1 counts how many Dhaarein the other person broke. Pillar 2 tells you straight up what punishment they face—jail time, fines, suspension. Pillar 3 scores how serious it is out of 10. And Pillar 4 gives you clickable government portals with a little ‘i’ button showing the exact 3 steps on that site, plus YouTube knowledge trailers—like how StopNCII uses image hashcodes to delete leaked photos worldwide.”'
      },
      {
        eyebrow: 'SLIDE 05 • PRIVACY ARCHITECTURE',
        title: 'Radical Anonymity: Aliases & Funny Blur Mode',
        subtitle: 'Privacy isn’t buried in settings—it is visible, playful, and automatic across the entire platform.',
        cards: [
          { title: 'Zero Client Photos', body: 'Citizens can never upload a profile picture. Everyone gets a fun alias (e.g. Amitabh Padukone #108).' },
          { title: 'Auto-PII Masker', body: 'PAN numbers, Aadhaar, phone numbers, and real names are stripped automatically.' },
          { title: 'Blur ON vs. Blur OFF', body: 'Blur ON blurs exact rupee amounts; Blur OFF shows funny representational numbers like ₹4,20,000 & ₹69,000.' }
        ],
        speech: '“If you’re a citizen on Vakaalat, you literally cannot upload a profile picture. Everybody gets a stage alias. And we put a Blur ON / Blur OFF button right in the top bar. When Blur is ON, amounts are blurred. And if someone clicks Blur OFF hoping to snoop on how much money you actually lost? It swaps the numbers with funny representational figures like ₹4,20,000 or ₹69,000. Your real numbers never leak.”'
      },
      {
        eyebrow: 'SLIDE 06 • CONVERSION FLOW',
        title: '1-Click AI Draft → Lodge in the Court of People',
        subtitle: 'An anxious citizen shouldn’t have to draft a formal legal post from scratch.',
        cards: [
          { title: 'AI Sentiment Drafting', body: 'Clicks "Lodge This Complaint" → Gemini writes a heartfelt anonymous post in their voice.' },
          { title: 'Edit or Post Live', body: 'Preview modal lets users tweak any word or publish immediately without editing.' },
          { title: '30-Second OTP Gate', body: 'Name (private), Alias (public), Phone OTP & Gmail—and the post goes live on /court.' }
        ],
        speech: '“Once you’ve got your 4-pillar first aid, right below Pillar 4 is one big green button: Lodge This Complaint in the Court of People. You click it, and our AI drafts a heartfelt anonymous post capturing your real emotion and the violated Dhaarein. A preview modal pops up—you can edit it or hit Post Without Editing, verify your phone with a quick OTP, and boom, it’s live at the top of the Court of People.”'
      },
      {
        eyebrow: 'SLIDE 07 • DUAL WORKSPACES',
        title: 'Personal Diary Desktop vs. Advocate Chambers',
        subtitle: 'Two completely distinct workspaces designed around how each role actually feels.',
        cards: [
          { title: 'Citizen: Personal Diary Desktop', body: 'Windows XP Desktop with clickable file icons named after each complaint, opening a lined notebook with likes & comments.' },
          { title: 'Lawyer: Advocate Chambers', body: 'Prominent Profile Views, Possible Clients matched by legal domain, and "People Who Spent Most Time On You."' }
        ],
        speech: '“Inside, the two dashboards feel completely different. For the citizen, it’s a Personal Diary Desktop—every complaint sits there like a clickable file icon on a Windows XP desktop that opens a lined notebook with all their comments and likes. For the lawyer, it’s Advocate Chambers—showing their profile views, threads matched to their legal domains under Possible Clients, and which anonymous citizens spent the longest reading their story.”'
      },
      {
        eyebrow: 'SLIDE 08 • MERITOCRACY',
        title: 'The 1,700-Char Gate & Attorney Leaderboard',
        subtitle: 'Lawyers cannot buy rankings or copy-paste AI bios—they earn trust through genuine effort.',
        cards: [
          { title: 'Copy-Paste Disabled', body: 'Advocates must type 1,700+ chars (or speak 2,000+ chars) about their college & journey + upload a Video CV.' },
          { title: 'Sorted by Helpful Likes', body: 'Every upvote on an advocate’s answer in the Court of People boosts their Leaderboard rank.' },
          { title: 'Pinned Ego Boost', body: 'Logged-in lawyers see: "YOU ARE THIS WEEK’S #3 MOST HOT LAWYER IN TOWN."' }
        ],
        speech: '“When an advocate registers on Vakaalat, copy-paste is disabled. They have to spend 10–15 minutes typing 1,700+ characters about their college and courtroom journey, plus upload a Video CV. And they can’t buy rankings—the Leaderboard is sorted purely by likes on their helpful comments. When a lawyer logs in, we pin them at the top with a banner saying: You are this week’s 3rd most hot lawyer in town.”'
      },
      {
        eyebrow: 'SLIDE 09 • DESIGN PSYCHOLOGY',
        title: 'Why Windows XP + Day Tropics & Night Minecraft Stars?',
        subtitle: 'Corporate legal websites intimidate stressed citizens. Nostalgic tactile UI makes people drop their guard.',
        cards: [
          { title: 'Tactile Windows XP Chrome', body: 'Beveled buttons, royal blue day headers, subtle matte gray night headers, and hand-drawn ink arrows.' },
          { title: 'Light Mode (Sun)', body: 'Swaying coconut trees, green grass & a 10-second sky/cloud/rotating-sun bloom while computing.' },
          { title: 'Dark Mode (Moon)', body: 'Pitch matte black (#050506) with Minecraft pixel stars, real constellations (Libra, Orion) & moon-phase loader.' }
        ],
        speech: '“People ask—why Windows XP windows, coconut trees in the day, and pitch-black Minecraft pixel stars at night? Because every other legal site looks like a scary tax form. When someone is hurt, corporate UI makes them clam up. Giving Vakaalat tactile XP buttons, hand-drawn ink arrows, a sunny tropical breeze by day, and pixel constellations with moon phases by night makes the space feel human and disarming.”'
      },
      {
        eyebrow: 'SLIDE 10 • BUSINESS MODEL & ROADMAP',
        title: 'Free Legal Commons + Direct Connect Subscriptions',
        subtitle: 'Never gatekeep basic legal literacy—monetize high-trust private connections.',
        cards: [
          { title: 'Vakaalat Direct Connect', body: 'Public guidance is free forever. Citizens buy a plan (Razorpay) only when they want to message a top advocate privately.' },
          { title: 'Self-Learning Experience Store', body: 'Anonymized evaluations log to experience/raw_evaluations.jsonl so our legal engine gets sharper over time.' },
          { title: 'Live & Deployed', body: 'Full-stack React + Node/Express + SQLite/Postgres + Gemini live on GitHub & Render.' }
        ],
        speech: '“Everything a citizen needs for first-aid and public community help is free forever. When a client trusts an advocate from their public reply and clicks Reach Out Directly for a private 1-on-1 bridge, that’s where our Vakaalat Direct Connect subscription comes in. And behind the scenes, our self-learning experience store logs anonymized patterns so the engine gets smarter with every case. Thank you—let’s jump into the live app!”'
      }
    ];

    let idx = 0;
    let showSpeech = true;

    function render() {
      const s = slides[idx];
      document.getElementById('win-title').textContent = `Vakaalat_Pitch_Deck.exe — Slide ${idx + 1} of ${slides.length}`;
      document.getElementById('slide-content').innerHTML = `
          <div class="eyebrow">${s.eyebrow}</div>
          <h1>${s.title}</h1>
          <p class="subtitle">${s.subtitle}</p>
          <div class="grid">
            ${s.cards.map(c => `<div class="card"><h3>${c.title}</h3><p>${c.body}</p></div>`).join('')}
          </div>
        `;
      document.getElementById('speech-content').textContent = s.speech;
    }

    function nextSlide() { idx = (idx + 1) % slides.length; render(); }
    function prevSlide() { idx = (idx - 1 + slides.length) % slides.length; render(); }
    function toggleSpeech() {
      showSpeech = !showSpeech;
      document.getElementById('speech-container').style.display = showSpeech ? 'block' : 'none';
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
      if (e.key === 'ArrowLeft') prevSlide();
    });

    render();
  </script>
</body>

</html>
